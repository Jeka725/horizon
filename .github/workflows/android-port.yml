name: Android ARM64 native build

on:
  push:
    branches: [android-port]
  pull_request:
    branches: [android-port]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-port-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-arm64-check:
    name: Build game client for Android ARM64
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install Android NDK
        uses: android-actions/setup-android@v3
        with:
          packages: ndk;27.2.12479018

      - name: Configure Android native toolchain
        shell: bash
        run: |
          set -euo pipefail
          NDK_ROOT="${ANDROID_NDK_HOME:-${ANDROID_HOME}/ndk/27.2.12479018}"
          TOOLCHAIN="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin"
          CLANG="$TOOLCHAIN/aarch64-linux-android24-clang"
          CLANGXX="$TOOLCHAIN/aarch64-linux-android24-clang++"
          test -x "$CLANG"
          test -x "$CLANGXX"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$CLANG" >> "$GITHUB_ENV"
          echo "CC_aarch64_linux_android=$CLANG" >> "$GITHUB_ENV"
          echo "CXX_aarch64_linux_android=$CLANGXX" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=$TOOLCHAIN/llvm-ar" >> "$GITHUB_ENV"

      - name: Build game client for Android ARM64
        run: cargo build -p horizon-client --no-default-features --target aarch64-linux-android

      - name: Upload Android ARM64 native binary
        uses: actions/upload-artifact@v4
        with:
          name: horizon-client-android-arm64-native-build
          path: target/aarch64-linux-android/debug/horizon-client
          if-no-files-found: error
          retention-days: 7
