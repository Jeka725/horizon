name: Horizon Android APK

on:
  push:
    branches: [android-port]
    paths:
      - "android-app/**"
      - "android-native/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android-apk.yml"
  pull_request:
    branches: [android-port]
    paths:
      - "android-app/**"
      - "android-native/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: horizon-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Horizon APK with Rust ARM64 bridge
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Set up Android NDK
        uses: android-actions/setup-android@v3
        with:
          packages: ndk;27.2.12479018

      - name: Build Rust JNI library for Android ARM64
        shell: bash
        run: |
          set -euo pipefail
          NDK_ROOT="${ANDROID_NDK_HOME:-${ANDROID_HOME}/ndk/27.2.12479018}"
          TOOLCHAIN="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$TOOLCHAIN/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
          cargo build --manifest-path android-native/Cargo.toml --release --target aarch64-linux-android
          mkdir -p android-app/src/main/jniLibs/arm64-v8a
          cp target/aarch64-linux-android/release/libhorizon_android.so android-app/src/main/jniLibs/arm64-v8a/

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: gradle --no-daemon :android-app:assembleDebug

      - name: Verify APK and native library
        shell: bash
        run: |
          set -euo pipefail
          APK="android-app/build/outputs/apk/debug/android-app-debug.apk"
          test -s "$APK"
          unzip -t "$APK"
          unzip -l "$APK" | grep -E 'lib/arm64-v8a/libhorizon_android.so'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: horizon-android-debug-apk
          path: android-app/build/outputs/apk/debug/android-app-debug.apk
          if-no-files-found: error
          retention-days: 7
