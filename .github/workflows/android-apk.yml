name: Horizon Android APK

on:
  push:
    branches: [android-port]
    paths:
      - "android-app/**"
      - "android-native/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android-apk.yml"
  pull_request:
    branches: [android-port]
    paths:
      - "android-app/**"
      - "android-native/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: horizon-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Horizon APK with Rust ARM64 bridge
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v3

      - name: Install Android NDK with retry
        shell: bash
        run: |
          set -euo pipefail
          NDK_VERSION="27.2.12479018"
          NDK_DIR="${ANDROID_HOME}/ndk/${NDK_VERSION}"
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort | tail -n 1)"
          fi
          test -x "$SDKMANAGER"
          for attempt in 1 2 3; do
            if [ -x "$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang" ]; then
              echo "NDK $NDK_VERSION is already installed and verified"
              exit 0
            fi
            echo "Installing NDK $NDK_VERSION (attempt $attempt/3)"
            rm -rf "$NDK_DIR"
            if yes | "$SDKMANAGER" --install "ndk;$NDK_VERSION" --sdk_root="${ANDROID_HOME}"; then
              if [ -x "$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang" ]; then
                echo "NDK installation verified"
                exit 0
              fi
            fi
            echo "NDK install attempt $attempt failed; retrying"
            sleep 5
          done
          echo "NDK installation failed after 3 attempts"
          exit 1

      - name: Build Rust JNI library for Android ARM64
        shell: bash
        run: |
          set -euo pipefail
          NDK_ROOT="${ANDROID_NDK_HOME:-${ANDROID_HOME}/ndk/27.2.12479018}"
          TOOLCHAIN="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$TOOLCHAIN/aarch64-linux-android24-clang"
          cargo build --manifest-path android-native/Cargo.toml --release --target aarch64-linux-android
          mkdir -p android-app/src/main/jniLibs/arm64-v8a
          cp android-native/target/aarch64-linux-android/release/libhorizon_android.so android-app/src/main/jniLibs/arm64-v8a/

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: gradle --no-daemon :android-app:assembleDebug

      - name: Verify APK and native library
        shell: bash
        run: |
          set -euo pipefail
          APK="android-app/build/outputs/apk/debug/android-app-debug.apk"
          test -s "$APK"
          unzip -t "$APK"
          unzip -l "$APK" | grep -E 'lib/arm64-v8a/libhorizon_android.so'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: horizon-android-debug-apk
          path: android-app/build/outputs/apk/debug/android-app-debug.apk
          if-no-files-found: error
          retention-days: 7
