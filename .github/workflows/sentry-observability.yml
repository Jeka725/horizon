name: Sentry observability

on:
  workflow_dispatch:
    inputs:
      time_range:
        description: "Sentry lookback window"
        required: true
        default: "24h"
        type: choice
        options:
          - "24h"
          - "7d"
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: read

jobs:
  sentry-health:
    name: Inspect unresolved Horizon issues
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_TIME_RANGE: ${{ inputs.time_range || '24h' }}
    steps:
      - name: Query Sentry read-only API
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request

          token = os.environ.get("SENTRY_AUTH_TOKEN", "")
          if not token:
              print("::error::SENTRY_AUTH_TOKEN is not available to this workflow.")
              sys.exit(1)

          base = "https://sentry.io/api/0"
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/json",
          }

          def get(path):
              request = urllib.request.Request(base + path, headers=headers)
              try:
                  with urllib.request.urlopen(request, timeout=20) as response:
                      return json.load(response)
              except urllib.error.HTTPError as error:
                  # Do not print request headers or token-bearing data.
                  print(f"::error::Sentry API returned HTTP {error.code} for {path.split('?')[0]}")
                  if error.code in (401, 403):
                      print("Check token validity and read-only scopes: org:read, project:read, event:read.")
                  sys.exit(1)

          organizations = get("/organizations/")
          matches = []
          for organization in organizations:
              org_slug = organization.get("slug")
              if not org_slug:
                  continue
              projects = get(f"/organizations/{urllib.parse.quote(org_slug, safe='')}/projects/")
              for project in projects:
                  slug = (project.get("slug") or "").lower()
                  name = (project.get("name") or "").lower()
                  if "horizon" in slug or "horizon" in name:
                      matches.append((org_slug, project.get("slug"), project.get("name") or project.get("slug")))

          if not matches:
              print("No Sentry project with 'horizon' in its name or slug was found.")
              print("Set up a Sentry project named Horizon, or adjust the project filter in this workflow.")
              sys.exit(0)

          period = os.environ.get("SENTRY_TIME_RANGE", "24h")
          print(f"Found {len(matches)} matching Horizon Sentry project(s); checking unresolved issues from {period}.")
          total = 0
          for org_slug, project_slug, project_name in matches:
              if not project_slug:
                  continue
              query = urllib.parse.urlencode({
                  "statsPeriod": period,
                  "query": "is:unresolved",
                  "limit": 10,
                  "environment": "prod",
              })
              issues = get(
                  f"/projects/{urllib.parse.quote(org_slug, safe='')}/"
                  f"{urllib.parse.quote(project_slug, safe='')}/issues/?{query}"
              )
              print(f"\nProject: {project_name} ({org_slug}/{project_slug})")
              if not issues:
                  print("No unresolved production issues in this time window.")
                  continue
              for issue in issues:
                  total += 1
                  print(
                      f"- {issue.get('shortId', 'unknown')} | "
                      f"{issue.get('status', 'unknown')} | "
                      f"events={issue.get('count', '0')} | "
                      f"last_seen={issue.get('lastSeen', 'unknown')} | "
                      f"{issue.get('title', 'Untitled issue')}"
                  )
          print(f"\nTotal unresolved issues reported: {total}")
          PY
